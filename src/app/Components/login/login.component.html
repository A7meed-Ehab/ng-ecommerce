<section class="bg-main-light shadow p-2 my-2 rounded-4">
  <h2 class="h1 text-main">Register Now:</h2>
  <form [formGroup]="loginForm">
    <div class="my-2">
      <label for="email">Enter The Email</label>
      <input
        type="text"
        id="email"
        formControlName="email"
        class="form-control"
      />
    </div>
    <div class="my-2">
      <label for="username">Enter The Password</label>
      <input
        type="text"
        id="password"
        formControlName="password"
        class="form-control"
      />
    </div>
    <button type="submit">Login</button>
  </form>
</section>
